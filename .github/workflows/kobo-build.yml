name: Build Kobo offline translator

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GitHub's Ubuntu image already contains the normal host build tools
      # (cmake, ninja, git, curl, Python, zip, etc.). Only install the ARM
      # cross compiler/sysroot here. Keeping this list small makes this step
      # substantially faster and less likely to look hung during dpkg setup.
      - name: Install ARM cross compiler
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          echo "[$(date -u +%H:%M:%S)] Updating apt indexes"
          sudo apt-get update -o Acquire::Retries=3
          echo "[$(date -u +%H:%M:%S)] Installing ARM compiler"
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libatomic1-armhf-cross
          echo "[$(date -u +%H:%M:%S)] ARM compiler ready"
          arm-linux-gnueabihf-gcc --version
          arm-linux-gnueabihf-g++ --version
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Checkout upstream plugin
        run: git clone --depth 1 https://github.com/anezih/offlinetranslator.koplugin.git upstream

      - name: Prepare upstream translator source
        run: |
          set -euxo pipefail
          cp -a upstream plugin
          rm -rf plugin/.git
          sh plugin/native/scripts/prepare-translator-rs.sh

      # The native dependency graph is large (MNN, slimt, ruy, tesseract,
      # leptonica, etc.). Persist Cargo's registry/git data and the target
      # directory so a failed build does not have to start from scratch.
      - name: Cache Rust/native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/native/bridge/target
            plugin/native/vendor/translator-rs.zip
            plugin/native/vendor/translator-rs.zip.commit
          key: kobo-armv7-${{ runner.os }}-${{ hashFiles('plugin/native/bridge/Cargo.lock', 'plugin/native/scripts/prepare-translator-rs.sh') }}
          restore-keys: |
            kobo-armv7-${{ runner.os }}-

      - name: Build native translation library for Kobo ARM
        working-directory: plugin/native/bridge
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CFLAGS: -march=armv7-a -mfpu=neon -mfloat-abi=hard
          CXXFLAGS: -march=armv7-a -mfpu=neon -mfloat-abi=hard
          # slimt-sys explicitly consumes these CMake variables. Setting the
          # compiler as well as the system/processor prevents its bundled ruy
          # cpuinfo CMake project from configuring itself for the x86_64 runner.
          CMAKE_SYSTEM_NAME: Linux
          CMAKE_SYSTEM_PROCESSOR: armv7
          CMAKE_C_COMPILER: arm-linux-gnueabihf-gcc
          CMAKE_CXX_COMPILER: arm-linux-gnueabihf-g++
          # Leptonica's environ.h uses C11 atomic_int when stdatomic is
          # available. bindgen only needs the opaque l_atomic FFI type, so use
          # the non-atomic declaration while generating bindings.
          BINDGEN_EXTRA_CLANG_ARGS: -D__STDC_NO_ATOMICS__
          # cortex-a8 is the ARMv7 CPU baseline used by the Kobo target.
          RUSTFLAGS: -C target-cpu=cortex-a8 -C target-feature=+neon -A dead_code
          # C++ LTO is not worth the extra build complexity on this target.
          SLIMT_ENABLE_LTO: "0"
        run: |
          set -euxo pipefail
          cargo build --release --target armv7-unknown-linux-gnueabihf --features ppocr

      - name: Verify binary
        run: |
          set -euxo pipefail
          SO=plugin/native/bridge/target/armv7-unknown-linux-gnueabihf/release/libofflinetranslator.so
          test -s "$SO"
          file "$SO"
          arm-linux-gnueabihf-readelf -h "$SO" | grep -E 'Class|Machine|Flags'
          # Fail early if the final shared object accidentally contains an
          # unresolved ARM cpuinfo symbol.
          if arm-linux-gnueabihf-readelf -Ws "$SO" | grep -q 'cpuinfo_arm_linux_init.*UND'; then
            echo 'ERROR: cpuinfo_arm_linux_init is still unresolved'
            exit 1
          fi

      - name: Package Kobo plugin
        run: |
          set -euxo pipefail
          OUT=dist/offlinetranslator.koplugin
          rm -rf dist
          mkdir -p "$OUT/libs/linux/armv7l"
          cp plugin/*.lua "$OUT/"
          cp plugin/README.md "$OUT/"
          cp -a plugin/resources "$OUT/"
          cp plugin/native/bridge/target/armv7-unknown-linux-gnueabihf/release/libofflinetranslator.so "$OUT/libs/linux/armv7l/"
          cd dist
          zip -r ../offlinetranslator-kobo-clara-bw.zip offlinetranslator.koplugin

      - name: Upload Kobo plugin
        uses: actions/upload-artifact@v4
        with:
          name: offlinetranslator-kobo-clara-bw
          path: offlinetranslator-kobo-clara-bw.zip
