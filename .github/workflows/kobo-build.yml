name: Build Kobo offline translator

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex gawk libtool libtool-bin libncurses-dev curl file git gperf help2man texinfo unzip wget cmake ninja-build pkg-config python3 zip clang perl
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Build exact KOReader Kobo cross-toolchain
        run: |
          set -eux
          git clone --depth 1 https://github.com/koreader/koxtoolchain.git koxtoolchain
          cd koxtoolchain
          ./gen-tc.sh kobo
          echo "$HOME/x-tools/arm-kobo-linux-gnueabihf/bin" >> "$GITHUB_PATH"
          echo "CROSS=$HOME/x-tools/arm-kobo-linux-gnueabihf/bin/arm-kobo-linux-gnueabihf" >> "$GITHUB_ENV"
          echo "SYSROOT=$HOME/x-tools/arm-kobo-linux-gnueabihf/arm-kobo-linux-gnueabihf/sysroot" >> "$GITHUB_ENV"

      - name: Configure Kobo cross compiler
        run: |
          set -eux
          test -x "$CROSS-gcc"
          test -x "$CROSS-g++"
          test -x "$CROSS-ar"
          "$CROSS-gcc" -v
          SYSROOT="$SYSROOT"
          printf '%s\n' \
            'set(CMAKE_SYSTEM_NAME Linux)' \
            'set(CMAKE_SYSTEM_PROCESSOR arm)' \
            "set(CMAKE_C_COMPILER $CROSS-gcc)" \
            "set(CMAKE_CXX_COMPILER $CROSS-g++)" \
            "set(CMAKE_AR $CROSS-ar)" \
            "set(CMAKE_SYSROOT $SYSROOT)" \
            "set(CMAKE_FIND_ROOT_PATH $SYSROOT)" \
            'set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)' \
            'set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)' \
            'set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)' \
            'set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)' > "$GITHUB_WORKSPACE/kobo-toolchain.cmake"
          echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/kobo-toolchain.cmake" >> "$GITHUB_ENV"

      - name: Checkout upstream plugin
        run: git clone --depth 1 https://github.com/anezih/offlinetranslator.koplugin.git upstream

      - name: Prepare translation-only source
        run: |
          set -eux
          cp -a upstream plugin
          rm -rf plugin/.git
          sh plugin/native/scripts/prepare-translator-rs.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path("plugin/native/bridge/Cargo.toml")
          s = p.read_text()
          s = s.replace(
              'translator = { path = "../vendor/translator-rs", features = ["tesseract"] }',
              'translator = { path = "../vendor/translator-rs", default-features = false }'
          )
          s = s.replace(
              '[features]\ndefault = ["ppocr", "manga-ocr"]',
              '[features]\ndefault = []\ntesseract = ["translator/tesseract"]'
          )
          p.write_text(s)
          PY

      - name: Build native translation library for Kobo ARM
        working-directory: plugin/native/bridge
        env:
          CC_armv7_unknown_linux_gnueabihf: ${{ env.CROSS }}-gcc
          CXX_armv7_unknown_linux_gnueabihf: ${{ env.CROSS }}-g++
          AR_armv7_unknown_linux_gnueabihf: ${{ env.CROSS }}-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: ${{ env.CROSS }}-gcc
          CFLAGS: -march=armv7-a -mfpu=neon -mfloat-abi=hard
          CXXFLAGS: -march=armv7-a -mfpu=neon -mfloat-abi=hard
          RUSTFLAGS: -C target-cpu=cortex-a8 -C target-feature=+neon -A dead_code
        run: cargo build --release --target armv7-unknown-linux-gnueabihf --no-default-features

      - name: Package Kobo plugin
        run: |
          set -eux
          OUT=dist/offlinetranslator.koplugin
          mkdir -p "$OUT/libs/linux/armv7l"
          cp plugin/*.lua "$OUT/"
          cp plugin/README.md "$OUT/"
          cp -a plugin/resources "$OUT/"
          cp plugin/native/bridge/target/armv7-unknown-linux-gnueabihf/release/libofflinetranslator.so "$OUT/libs/linux/armv7l/"
          cd dist
          zip -r ../offlinetranslator-kobo-clara-bw.zip offlinetranslator.koplugin

      - name: Upload Kobo plugin
        uses: actions/upload-artifact@v4
        with:
          name: offlinetranslator-kobo-clara-bw
          path: offlinetranslator-kobo-clara-bw.zip
