name: Build Kobo plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: koreader/kokobo:latest
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -eux
          command -v arm-kobo-linux-gnueabihf-gcc
          arm-kobo-linux-gnueabihf-gcc --version
          command -v cargo
          cargo --version
          rustc --version

      - name: Fetch upstream plugin
        run: |
          set -eux
          rm -rf upstream
          git clone --depth 1 https://github.com/anezih/offlinetranslator.koplugin.git upstream

      - name: Configure Kobo build
        working-directory: upstream
        run: |
          set -eux
          # The Clara BW uses the Kobo ARM Linux userspace. KOReader's Kobo
          # toolchain is supplied by the kokobo build container.
          rustup target add armv7-unknown-linux-gnueabihf
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-kobo-linux-gnueabihf-gcc"
          ar = "arm-kobo-linux-gnueabihf-ar"
          EOF

          # We only need text translation. Disable the optional PaddleOCR and
          # Manga OCR features so the Kobo build does not pull in ONNX/MNN.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/bridge/Cargo.toml')
          s = p.read_text()
          s = s.replace('default = ["ppocr", "manga-ocr"]', 'default = []')
          p.write_text(s)
          PY

          sh native/scripts/prepare-translator-rs.sh
          sh native/scripts/patch-tesseract-sys.sh

      - name: Build native translator for Kobo
        working-directory: upstream/native/bridge
        env:
          CARGO_BUILD_TARGET: armv7-unknown-linux-gnueabihf
          CC_armv7_unknown_linux_gnueabihf: arm-kobo-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-kobo-linux-gnueabihf-g++
          AR_armv7_unknown_linux_gnueabihf: arm-kobo-linux-gnueabihf-ar
          CFLAGS_armv7_unknown_linux_gnueabihf: -march=armv7-a -mfpu=neon -mfloat-abi=hard -fPIC
          CXXFLAGS_armv7_unknown_linux_gnueabihf: -march=armv7-a -mfpu=neon -mfloat-abi=hard -fPIC
          RUSTFLAGS: -C target-feature=+neon -C link-arg=-Wl,--allow-multiple-definition
        run: |
          set -eux
          cargo build --release --no-default-features
          file target/armv7-unknown-linux-gnueabihf/release/libofflinetranslator.so
          arm-kobo-linux-gnueabihf-readelf -h target/armv7-unknown-linux-gnueabihf/release/libofflinetranslator.so

      - name: Package plugin
        run: |
          set -eux
          rm -rf dist
          mkdir -p dist/offlinetranslator.koplugin/libs/kobo
          cp upstream/README.md upstream/*.lua dist/offlinetranslator.koplugin/
          cp -R upstream/resources dist/offlinetranslator.koplugin/
          cp upstream/native/bridge/target/armv7-unknown-linux-gnueabihf/release/libofflinetranslator.so dist/offlinetranslator.koplugin/libs/kobo/
          tar -C dist -czf offlinetranslator-kobo-clara-bw.tar.gz offlinetranslator.koplugin

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: offlinetranslator-kobo-clara-bw
          path: offlinetranslator-kobo-clara-bw.tar.gz
